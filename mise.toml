[tasks.extract-docs]
sources = ['README.md', 'src/extension/**/*.ts']
outputs = ['docs/**/*.md']
run = 'simple-src-docs -d docs src README.md'

[tasks.dev-docs]
depends = ['extract-docs']
run = 'pnpm exec vitepress dev docs'

[tasks.build-docs]
sources = ['docs/**/*.md']
outputs = ['docs/.vitepress/dist/**/*']
depends = ['extract-docs']
run = 'pnpm exec vitepress build docs'
