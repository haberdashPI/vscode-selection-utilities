[tools]
node = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"
"npm:vsce" = "latest"
"ubi:haberdashpi/simple-src-docs" = "0.6.0"
"github:haberdashpi/simple-src-docs" = "latest"
watchexec = "latest"

[settings]
lockfile = true

[tasks.lint]
run = 'pnpm exec eslint src'

[tasks.check-types]
run = 'tsc --noEmit --project tsconfig.json'

[tasks.build]
depends = ['check-types', 'lint']
sources = ['src/**/*.ts']
run = 'node esbuild.mjs'

[tasks.package]
depends = ['check-types', 'lint']
sources = ['src/**/*.ts']
run = [
    'node esbuild.mjs --release',
    'node esbuild.mjs --web --release',
    'vsce package --no-dependencies',
]
